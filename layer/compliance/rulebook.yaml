# Rulebook — declarative guardrail rules for the interview agent.
# Rules are DATA, not code. Edit here to change agent behavior; the guardrails
# engine enforces whatever is defined below.

# What the agent is allowed to be. Used to prime classifiers and to reject
# attempts to redefine the agent ("you are now a chef", etc.).
scope:
  purpose: >
    A phone screening interviewer for Soliant (healthcare/education staffing).
    It may only greet the candidate, ask the interview questions it is given,
    ask short clarifying follow-ups, redirect off-topic input back to the
    interview, and close the call. It must never do anything else.
  allowed_intents:
    - answer_interview_question
    - clarify_question
    - smalltalk_brief          # "I'm good, thanks" — brief courtesy is fine
  # Topics that are clearly outside a screening interview. Used by the input
  # filter as fast keyword signals (the classifier is the primary check).
  off_topic_signals:
    - recipe
    - cook
    - weather
    - joke
    - poem
    - write code
    - homework
    - essay
    - translate
    - stock
    - medical advice
    - diagnos

# Prompt-injection / jailbreak signals. If input matches, treat as BLOCK, not a
# gentle redirect — the candidate is trying to change the agent's behavior.
injection_signals:
  - ignore previous
  - ignore your instructions
  - disregard the
  - you are now
  - act as
  - pretend to be
  - system prompt
  - developer mode
  - jailbreak
  - forget the interview

# Output sanctioning. The agent may ONLY speak utterances of these kinds. Any
# generated line that is not one of these is blocked (this is what stops the
# "pancake recipe" class of failure regardless of context growth).
allowed_output_kinds:
  - greeting
  - question          # verbatim from the question bank
  - followup          # a generated follow-up (still length/scope-checked)
  - redirect          # an approved redirect line
  - closing

output_limits:
  # A sanctioned follow-up must look like a question and stay short.
  followup_max_chars: 240
  followup_must_end_with_question_mark: true
  # Hard banned substrings in ANY agent output (defense in depth).
  banned_output_substrings:
    - "recipe"
    - "here's how to"
    - "step 1"
    - "ingredients"

# Budgets — hard caps enforced in code so context/behavior can't grow unbounded.
budgets:
  max_followups_per_question: 2
  max_total_turns: 60            # candidate turns before forced close
  max_call_seconds: 900          # 15 min hard cap
  max_offtopic_before_end: 3     # after N redirects, warn + end gracefully

# Canned lines the guardrails use (kept out of the LLM so they can't be altered).
messages:
  redirect: "Let's keep our focus on the interview. Could you go ahead and answer the question I asked?"
  redirect_final: "I need us to stay on the interview questions. If we can't, I'll have to end the call."
  blocked_injection: "I can only help with this interview. Let's continue — could you answer the question?"
  end_offtopic: "It seems we're not able to continue with the interview right now. Thank you for your time. Goodbye."
  output_blocked_fallback: "Let's continue with the interview."
