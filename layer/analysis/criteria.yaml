        - id: rx_pressure_outcome
          label: "States the outcome and any learning"
          signals: [outcome, resolved, safe, learned, prevented]
    beh_2:
      competency: "Conflict resolution & communication"
      criteria:
        - id: rx_conflict_context
          label: "Describes a real disagreement with a colleague/prescriber"
          signals: [disagree, prescriber, physician, technician, colleague]
        - id: rx_conflict_approach
          label: "Shows a professional, patient-safety-first approach"
